<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>मोनाली ❤ शुभम | शुभविवाह निमंत्रण</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --maroon:#5c1a1a;
    --gold:#c9a227;
    --gold-light:#f3e5c3;
    --cream:#fdf6e9;
    --ink:#3b2312;
    --marigold:#f7931e;
    --marigold-dark:#c0392b;
    --leaf:#4a7c3a;
    --leaf-light:#6fae52;
    --teal:#1f7a6c;
    --pink:#c9436b;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100vh;height:100dvh;overflow:hidden;background:var(--maroon);font-family:'Noto Sans Devanagari',sans-serif;color:var(--ink);}
  #stage{position:fixed;inset:0;height:100vh;height:100dvh;overflow:hidden;}
  .page{
    position:absolute;inset:0;height:100%;
    background:linear-gradient(180deg,var(--cream) 0%, var(--gold-light) 100%);
    transform:translate3d(0,100%,0);
    transition:transform 1.6s cubic-bezier(.65,0,.35,1);
    will-change:transform;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    background-size:cover;background-position:center 22%;
  }
  .page-inner{
    width:100%;height:100%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:26px 18px 96px;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
  .page-inner.scrollpage{justify-content:flex-start;padding-top:56px;padding-bottom:150px;}
  .page.active{transform:translate3d(0,0,0);z-index:2;}
  .page.above{transform:translate3d(0,-100%,0);z-index:1;}
  .page.below{transform:translate3d(0,100%,0);z-index:1;}
  .border-frame{position:absolute;inset:10px;border:3px double var(--marigold);border-radius:14px;pointer-events:none;}
  h1.title{font-family:'Noto Serif Devanagari',serif;font-weight:700;color:var(--maroon);font-size:2rem;margin:8px 0 6px;position:relative;z-index:2;}
  h2.names{font-family:'Noto Serif Devanagari',serif;font-weight:700;color:var(--maroon);font-size:1.7rem;line-height:1.5;margin-top:8px;position:relative;z-index:2;}
  .om-line{font-size:.85rem;color:var(--leaf);letter-spacing:.5px;margin-bottom:6px;margin-top:8px;position:relative;z-index:2;}
  p{font-size:1.15rem;line-height:1.85;margin:6px 0;max-width:520px;position:relative;z-index:2;font-weight:500;}
  .small{font-size:1.02rem;color:#4a2c10;font-weight:600;}
  .divider{width:70px;height:3px;background:linear-gradient(90deg,var(--marigold),var(--leaf),var(--pink));margin:14px auto;border-radius:3px;position:relative;z-index:2;}
  .card{background:#fffdf7;border:2px solid #d8bf85;border-radius:16px;padding:16px 18px;margin:10px 0;max-width:520px;width:100%;box-shadow:0 4px 14px rgba(92,26,26,.1);position:relative;z-index:2;}
  .btn{
    display:inline-block;margin:10px 6px;padding:11px 22px;border-radius:30px;
    background:var(--maroon);color:#fff;text-decoration:none;font-weight:600;font-size:.95rem;
    border:none;cursor:pointer;box-shadow:0 3px 10px rgba(92,26,26,.3);position:relative;z-index:2;
  }
  .btn.gold{background:var(--marigold);color:#4a2200;}

  .corner-flower{position:absolute;width:38px;height:38px;opacity:.9;pointer-events:none;z-index:1;}
  .corner-flower.tl{top:14px;left:14px;}
  .corner-flower.tr{top:14px;right:14px;transform:scaleX(-1);}
  .corner-flower.bl{bottom:68px;left:14px;transform:scaleY(-1);}
  .corner-flower.br{bottom:68px;right:14px;transform:scale(-1,-1);}
  .toran-strip{width:100%;max-width:560px;margin:0 auto 6px;position:relative;z-index:2;}

  /* Nav controls */
  #nav{position:fixed;left:0;right:0;bottom:14px;display:flex;justify-content:center;gap:14px;z-index:50;}
  #nav button{
    background:var(--maroon);color:#fff;border:none;border-radius:24px;
    padding:10px 20px;font-size:.95rem;font-weight:600;box-shadow:0 3px 10px rgba(0,0,0,.25);
  }
  #nav button:disabled{opacity:.35;}
  #dots{position:fixed;top:12px;left:0;right:0;display:flex;justify-content:center;gap:6px;z-index:50;}
  #dots span{width:7px;height:7px;border-radius:50%;background:rgba(92,26,26,.25);}
  #dots span.on{background:var(--maroon);}

  /* Shivling animation */
  .shiv-wrap{position:relative;width:220px;height:260px;margin:4px auto 2px;}
  .drop{position:absolute;left:110px;top:56px;width:9px;height:13px;margin-left:-4px;background:#5aa9d6;border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;opacity:0;animation-name:fall;animation-duration:1.1s;animation-timing-function:ease-in;animation-iteration-count:1;animation-fill-mode:forwards;}
  .drop.d1{animation-delay:.6s;}
  .drop.d2{animation-delay:1.5s;}
  .drop.d3{animation-delay:2.4s;}
  .drop.d4{animation-delay:3.3s;}
  @keyframes fall{
    0%{opacity:0;transform:translateY(0) scale(.7);}
    15%{opacity:1;}
    80%{opacity:1;}
    100%{opacity:0;transform:translateY(74px) scale(.9);}
  }
  #shiv-continue{opacity:0;animation:revealBtn .6s ease forwards;animation-delay:6s;}
  @keyframes revealBtn{to{opacity:1;}}
  .garland{position:absolute;inset:0;opacity:0;pointer-events:none;animation:garlandIn .8s ease forwards;animation-delay:4.4s;}
  @keyframes garlandIn{0%{opacity:0;transform:translateY(-12px) scale(.92);}100%{opacity:1;transform:translateY(0) scale(1);}}

  .fam-grid{display:flex;flex-direction:column;gap:10px;width:100%;max-width:520px;}
  .fam-col h3{color:var(--maroon);font-family:'Noto Serif Devanagari',serif;font-weight:700;font-size:1.25rem;margin-bottom:4px;}

  #stopwatch{display:flex;gap:10px;justify-content:center;margin:14px 0;flex-wrap:wrap;}
  .sw-unit{background:var(--maroon);color:#fff;border-radius:10px;padding:10px 12px;min-width:64px;}
  .sw-unit .num{font-size:1.4rem;font-weight:700;}
  .sw-unit .lab{font-size:.7rem;opacity:.85;}

  .apt-card h3{color:var(--maroon);font-family:'Noto Serif Devanagari',serif;font-weight:700;font-size:1.15rem;margin-bottom:8px;}
  .pill-wrap{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:left;}
  .pill{background:#fffdf6;border:1.5px solid #d8bf85;border-left:5px solid var(--marigold);color:#3b1a10;padding:8px 10px;border-radius:8px;font-size:.86rem;font-weight:700;line-height:1.4;box-shadow:0 1px 4px rgba(92,26,26,.12);}
  .pill:nth-child(4n+2){border-left-color:var(--leaf);}
  .pill:nth-child(4n+3){border-left-color:var(--pink);}
  .pill:nth-child(4n+4){border-left-color:var(--teal);}
  .kum-row{font-size:1rem;}

  .fam-row{display:flex;align-items:center;gap:10px;text-align:left;}
  .toon-box{flex:0 0 72px;width:72px;height:94px;}
  .toon-box svg{width:100%;height:100%;animation:toonBob 2.6s ease-in-out infinite;}
  @keyframes toonBob{0%,100%{transform:translateY(0) rotate(-1deg);}50%{transform:translateY(-5px) rotate(1deg);}}
  .fam-text{flex:1;}

  .photo-frame{position:relative;width:92%;max-width:340px;border-radius:16px;overflow:hidden;border:4px solid var(--marigold);box-shadow:0 6px 20px rgba(92,26,26,.25);}
  .photo-frame img{display:block;width:100%;height:auto;}
  .petal-layer{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
  .petal{position:absolute;top:-20px;font-size:16px;animation-name:petalFall;animation-timing-function:linear;animation-iteration-count:infinite;}
  @keyframes petalFall{0%{transform:translateY(-20px) rotate(0deg);opacity:.9;}100%{transform:translateY(340px) rotate(360deg);opacity:.7;}}

  #musicBtn{position:fixed;top:14px;right:14px;z-index:60;background:var(--maroon);color:#fff;border:none;border-radius:50%;width:40px;height:40px;font-size:1.1rem;box-shadow:0 3px 10px rgba(0,0,0,.3);}

  
</style>
</head>
<body>

<div id="dots"></div>
<button id="musicBtn" title="Music">🎵</button>
<audio id="bgMusic" loop preload="none">
  <source src="kahin-jashn-e-bahaara.mp3" type="audio/mpeg">
</audio>
<div id="stage"></div>
<div id="nav">
  <button id="prevBtn">◀ मागे</button>
  <button id="nextBtn">पुढे ▶</button>
</div>

    petals += `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="7" fill="#f7931e"/>`;
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 38 38">${petals}<circle cx="19" cy="19" r="6.5" fill="#c0392b"/></svg>`;
}

function petalShower(container, count){
  const colors = ['#f7931e','#c9436b','#f1c40f','#e74c3c','#ff9fb2'];
  for(let i=0;i<count;i++){
    const p = document.createElement('div');
    p.className = 'petal';
    p.textContent = '🌸';
    p.style.left = (Math.random()*90+2)+'%';
    p.style.color = colors[i%colors.length];
    p.style.animationDuration = (2.5+Math.random()*2.5)+'s';
    p.style.animationDelay = (Math.random()*3)+'s';
    p.style.fontSize = (12+Math.random()*10)+'px';
    container.appendChild(p);
  }
}
function toranSVG(width){
  const nodeCount = Math.max(6, Math.round(width/58));
  const gap = width/(nodeCount+1);
  let nodes = `<line x1="0" y1="2" x2="${width}" y2="2" stroke="#8a6b3a" stroke-width="2"/>`;
  for(let i=1;i<=nodeCount;i++){
    const x = gap*i;
    const flower = i%2===0;
    nodes += `<line x1="${x}" y1="2" x2="${x}" y2="14" stroke="#8a6b3a" stroke-width="1.5"/>`;
    nodes += `<ellipse cx="${(x-6).toFixed(1)}" cy="26" rx="6" ry="15" fill="${flower?'#6fae52':'#4a7c3a'}" transform="rotate(-28 ${(x-6).toFixed(1)} 26)"/>`;
    nodes += `<ellipse cx="${(x+6).toFixed(1)}" cy="26" rx="6" ry="15" fill="${flower?'#4a7c3a':'#6fae52'}" transform="rotate(28 ${(x+6).toFixed(1)} 26)"/>`;
    if(flower){
      nodes += `<circle cx="${x}" cy="44" r="6.5" fill="#f7931e"/><circle cx="${x}" cy="44" r="2.6" fill="#c0392b"/>`;
    }
  }
  return `<svg viewBox="0 0 ${width} 52" width="100%" height="54" preserveAspectRatio="none">${nodes}</svg>`;
}

function goTo(next){
  if(next<0 || next>=pageEls.length || next===current) return;
  const nextInner = pageEls[next].querySelector('.page-inner');
  if(nextInner) nextInner.scrollTop = 0;
  pageEls.forEach((el,i)=>{
    el.classList.remove('active','above','below');
    if(i<next) el.classList.add('above');
    else if(i>next) el.classList.add('below');
  });
  pageEls[next].classList.add('active');
  current = next;
  updateNav();
}
document.getElementById('nextBtn').onclick = ()=>goTo(current+1);
document.getElementById('prevBtn').onclick = ()=>goTo(current-1);
updateNav();

/* ---------- Shivling continue button ---------- */
document.getElementById('shiv-continue').addEventListener('click', ()=>{ goTo(1); playMusic(); });

/* ---------- Background music ---------- */
const bgMusic = document.getElementById('bgMusic');
const musicBtn = document.getElementById('musicBtn');
let musicOn = false;
function playMusic(){
  bgMusic.play().then(()=>{ musicOn = true; musicBtn.textContent = '🔊'; }).catch(()=>{ musicOn = false; });
}
musicBtn.addEventListener('click', ()=>{
  if(musicOn){ bgMusic.pause(); musicOn = false; musicBtn.textContent = '🎵'; }
  else { playMusic(); }
});

/* ---------- Stopwatch countdown to Vivah Muhurat ---------- */
(function(){
  const target = new Date('2026-10-29T19:10:00+05:30').getTime();
  function tick(){
    const now = Date.now();
    let diff = target - now;
    if(diff<0) diff=0;
    const d = Math.floor(diff/(1000*60*60*24));
    const h = Math.floor((diff/(1000*60*60))%24);
    const m = Math.floor((diff/(1000*60))%60);
    const s = Math.floor((diff/1000)%60);
    const set=(id,v)=>{const el=document.getElementById(id); if(el) el.textContent=String(v).padStart(2,'0');};
    set('sw-d',d); set('sw-h',h); set('sw-m',m); set('sw-s',s);
  }
  tick();
  setInterval(tick,1000);
})();
</script>
